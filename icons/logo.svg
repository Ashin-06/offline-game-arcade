<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Master artwork: a game controller whose cord has been unplugged. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4bff"/>
      <stop offset="1" stop-color="#1fb6c9"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#tile)"/>
  <!-- Socket end of the cord -->
  <path d="M48 0v6" stroke="#ffffff" stroke-width="5"/>
  <rect x="38" y="6" width="20" height="9" rx="3" fill="#ffffff"/>
  <path d="M43 15v5M53 15v5" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Plug end, pulled away from it -->
  <rect x="40" y="26" width="16" height="6" rx="2.5" fill="#ffffff"/>
  <path d="M48 32v9" stroke="#ffffff" stroke-width="5"/>
  <!-- Controller -->
  <path d="M28 39h40c11 0 18 8 20 20l2 14c1 7-8 11-13 5l-7-9H26l-7 9c-5 6-14 2-13-5l2-14c2-12 9-20 20-20z" fill="#ffffff"/>
  <path d="M26 46h7v7h7v7h-7v7h-7v-7h-7v-7h7z" fill="#3a2bb8"/>
  <circle cx="66" cy="50" r="5.4" fill="#ff5d7a"/>
  <circle cx="74" cy="60" r="5.4" fill="#ffb627"/>
</svg>
