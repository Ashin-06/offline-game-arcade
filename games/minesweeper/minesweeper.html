<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Play Minesweeper</title>
    <link rel="stylesheet" href="minesweeper.css">
</head>
<body>
    <h1>Minesweeper</h1>

    <!-- NEW: Settings panel for custom games -->
    <div class="settings">
        <div class="setting-item">
            <label for="rowsInput">Rows:</label>
            <input type="number" id="rowsInput" value="16" min="8" max="30">
        </div>
        <div class="setting-item">
            <label for="colsInput">Columns:</label>
            <input type="number" id="colsInput" value="16" min="8" max="40">
        </div>
        <div class="setting-item">
            <label for="minesInput">Mines:</label>
            <input type="number" id="minesInput" value="40" min="10">
        </div>
        <button id="newGameButton">New Game</button>
    </div>

    <div id="board"></div>
    <div id="result-message" class="hidden"></div>

    <script src="minesweeper.js"></script>
</body>
</html>
