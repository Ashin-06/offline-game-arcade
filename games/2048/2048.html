<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Play 2048</title>
    <link rel="stylesheet" href="2048.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>2048</h1>
            <div class="info-box">
                <div class="score-container">
                    Score
                    <span id="score">0</span>
                </div>
                <button id="restartButton">New Game</button>
            </div>
        </div>
        <div class="instructions">
            <p>Use your <strong>arrow keys</strong> to move the tiles. When two tiles with the same number touch, they <strong>merge into one!</strong></p>
        </div>
        <div class="grid-container">
            <!-- Tiles will be generated by JavaScript -->
        </div>
        <div class="game-message-overlay" id="gameMessageOverlay">
            <p id="gameMessageText"></p>
            <button id="continueButton">Keep Going</button>
            <button id="tryAgainButton">Try Again</button>
        </div>
    </div>
    <script src="2048.js"></script>
</body>
</html>
