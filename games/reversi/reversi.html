<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reversi - Offline Game Arcade</title>
  <link rel="icon" href="../../icons/icon48.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="stylesheet" href="reversi.css">
</head>
<body class="game" style="--accent: #7ce38b">
  <main class="stage">
    <div class="reversi">
      <div id="board" role="group" aria-label="Reversi board"></div>
      <div class="reversi-foot">
        <span id="status"></span>
        <button type="button" id="undo">Undo</button>
      </div>
    </div>
  </main>
  <script src="../../shared/arcade.js"></script>
  <script src="reversi.logic.js"></script>
  <script src="reversi.js"></script>
</body>
</html>
