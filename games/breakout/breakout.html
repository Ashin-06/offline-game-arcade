<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Play Breakout</title>
    <link rel="stylesheet" href="breakout.css">
</head>
<body>
    <canvas id="breakoutCanvas" width="800" height="600"></canvas>
    <div class="controls">
        <div class="control-group">
            <label for="speedSlider">Ball Speed:</label>
            <input type="range" id="speedSlider" min="1" max="10" value="4">
            <span id="speedValue">4</span>
        </div>
        <button id="restartButton">Restart Game</button>
    </div>
    <script src="breakout.js"></script>
</body>
</html>
