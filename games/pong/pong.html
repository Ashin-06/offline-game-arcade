<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Play Pong</title>
    <link rel="stylesheet" href="pong.css">
</head>
<body>
    <canvas id="pongCanvas" width="1000" height="600"></canvas>
    
    <div class="controls">
        <div class="control-group">
            <label for="winningScoreInput">Winning Score:</label>
            <input type="number" id="winningScoreInput" value="10" min="1">
        </div>

        <div class="control-group">
            <label for="speedSlider">Ball Speed:</label>
            <input type="range" id="speedSlider" min="1" max="10" value="5">
            <span id="speedValue">5</span>
        </div>

        <button id="restartButton">Restart Game</button>
    </div>

    <script src="pong.js"></script>
</body>
</html>
