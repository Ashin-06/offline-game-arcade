<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ludo - Offline Game Arcade</title>
  <link rel="icon" href="../../icons/icon48.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="stylesheet" href="ludo.css">
</head>
<body class="game" style="--accent: #ffd24d">
  <main class="stage">
    <div class="ludo">
      <div class="table">
        <canvas id="board" width="600" height="600" role="img" aria-label="Ludo board"></canvas>
        <div id="tokens"></div>
      </div>
      <div class="foot">
        <button type="button" id="die" aria-label="Roll the die"></button>
        <span id="status" role="status"></span>
      </div>
    </div>
  </main>
  <script src="../../shared/arcade.js"></script>
  <script src="ludo.logic.js"></script>
  <script src="ludo.js"></script>
</body>
</html>
